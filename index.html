<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海南师范大学校园植物共创地图</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f4f0;min-height:100vh;color:#2c3e2d}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* 顶部工具栏 */
#toolbar{background:#fff;border-bottom:1px solid #d0dcc8;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.toolbar-logo{font-size:16px;font-weight:600;color:#2d6a2d;white-space:nowrap;display:flex;align-items:center;gap:6px}
.toolbar-logo span{font-size:20px}
.toolbar-group{display:flex;align-items:center;gap:8px}
.toolbar-label{font-size:12px;color:#5a7a5a;white-space:nowrap}
select,button{font-size:13px;border:1px solid #c8d8c8;border-radius:8px;padding:6px 12px;background:#fff;cursor:pointer;color:#2c3e2d;outline:none;transition:all .15s}
select:hover,button:hover{border-color:#4a9a4a;background:#f5fbf5}
select:focus{border-color:#4a9a4a;box-shadow:0 0 0 2px rgba(74,154,74,0.15)}
.btn-primary{background:#3d7a3d;color:#fff;border-color:#3d7a3d;font-weight:500}
.btn-primary:hover{background:#2d6a2d;border-color:#2d6a2d}
.btn-accent{background:#e8a030;color:#fff;border-color:#e8a030}
.btn-accent:hover{background:#c8882a;border-color:#c8882a}
.btn-info{background:#3878b8;color:#fff;border-color:#3878b8}
.btn-info:hover{background:#2868a8;border-color:#2868a8}
.btn-danger{background:#b83838;color:#fff;border-color:#b83838}
.btn-danger:hover{background:#982828;border-color:#982828}
.sep{width:1px;height:28px;background:#d8e8d8;flex-shrink:0}

/* 季节badge */
.season-badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;border:none;cursor:default}
.season-spring{background:#d4f0d4;color:#2d7a2d}
.season-summer{background:#ffd4a0;color:#884800}
.season-autumn{background:#f8d080;color:#7a5000}
.season-winter{background:#d8eaf8;color:#2858a8}

/* 主内容区 */
#main{flex:1;display:flex;overflow:hidden;position:relative}

/* 地图容器 */
#map-container{flex:1;position:relative;overflow:hidden;background:#e8f0e8}
#map-wrapper{position:relative;width:100%;height:100%;overflow:hidden;cursor:default}
#campus-img{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;max-width:none;transition:none}
#plant-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:25}
#interaction-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:20}

/* 缩放控件 */
#zoom-controls{position:absolute;bottom:20px;right:20px;display:flex;flex-direction:column;gap:4px;z-index:50}
#zoom-controls button{width:36px;height:36px;border-radius:8px;border:1px solid #c8d8c8;background:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.12)}
#zoom-controls button:hover{background:#f5fbf5;border-color:#4a9a4a}

/* 比例尺 */
#scale-info{position:absolute;bottom:20px;left:20px;background:rgba(255,255,255,0.9);border:1px solid #c8d8c8;border-radius:8px;padding:6px 12px;font-size:12px;color:#4a6a4a;z-index:50}

/* 右侧面板 */
#side-panel{width:290px;background:#fff;border-left:1px solid #d0dcc8;display:flex;flex-direction:column;overflow:hidden;z-index:30}
#panel-tabs{display:flex;border-bottom:1px solid #d0dcc8}
.panel-tab{flex:1;padding:10px 6px;text-align:center;font-size:12px;cursor:pointer;color:#6a8a6a;border-bottom:2px solid transparent;transition:all .15s}
.panel-tab.active{color:#2d6a2d;border-bottom-color:#3d7a3d;font-weight:500}
#panel-content{flex:1;overflow-y:auto;padding:12px}

/* 表单元素 */
.form-row{margin-bottom:12px}
.form-label{font-size:12px;color:#4a6a4a;margin-bottom:5px;display:block;font-weight:500}
.form-input{width:100%;padding:7px 10px;border:1px solid #c8d8c8;border-radius:8px;font-size:13px;color:#2c3e2d;outline:none;background:#fff}
.form-input:focus{border-color:#4a9a4a;box-shadow:0 0 0 2px rgba(74,154,74,0.1)}
textarea.form-input{resize:vertical;min-height:70px;line-height:1.6}
.form-hint{font-size:11px;color:#8aaa8a;margin-top:3px}

/* 月份勾选网格 */
.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.month-btn{padding:5px 2px;border:1px solid #d0dcc8;border-radius:6px;font-size:11px;text-align:center;cursor:pointer;background:#fff;color:#5a7a5a;transition:all .12s;user-select:none}
.month-btn:hover{border-color:#5aaa5a;background:#f5fbf5}
.month-btn.selected-bloom{background:#4caf50;color:#fff;border-color:#4caf50}
.month-btn.selected-fruit{background:#ff9800;color:#fff;border-color:#ff9800}
.month-btn.selected-dormant{background:#9c27b0;color:#fff;border-color:#9c27b0}

/* 颜色/图标选择 */
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:4px}
.icon-btn{width:30px;height:30px;border:1px solid #d0dcc8;border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all .12s}
.icon-btn:hover{border-color:#5aaa5a;background:#f5fbf5}
.icon-btn.selected{border-color:#3d7a3d;background:#e8f5e8;box-shadow:0 0 0 2px rgba(61,122,61,0.2)}

.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:4px}
.color-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .12s}
.color-btn:hover{transform:scale(1.15)}
.color-btn.selected{border-color:#fff;box-shadow:0 0 0 2px #3d7a3d}

/* 植物列表卡片 */
.plant-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid #e8f0e8;margin-bottom:6px;cursor:pointer;transition:all .15s}
.plant-item:hover{border-color:#4a9a4a;background:#f5fbf5}
.plant-item.selected{border-color:#3d7a3d;background:#e8f5e8}
.plant-icon-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.plant-info{flex:1;min-width:0}
.plant-name-text{font-size:13px;font-weight:500;color:#2c3e2d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plant-sub-text{font-size:11px;color:#6a8a6a}
.plant-actions{display:flex;gap:4px;flex-shrink:0}
.plant-del{width:22px;height:22px;border-radius:50%;border:1px solid #f0c8c8;background:#fff;color:#b83838;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.plant-del:hover{background:#fde8e8}
.plant-edit-btn{width:22px;height:22px;border-radius:50%;border:1px solid #c8e0c8;background:#fff;color:#3d7a3d;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.plant-edit-btn:hover{background:#e8f5e8}

/* 上传区域 */
.upload-zone{border:2px dashed #c8d8c8;border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:10px}
.upload-zone:hover,.upload-zone.dragover{border-color:#4a9a4a;background:#f0f9f0}
.upload-zone p{color:#6a8a6a;font-size:12px;margin-top:4px}

/* 照片预览小格 */
.photo-preview-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.photo-preview-item{position:relative;width:60px;height:60px;border-radius:8px;overflow:hidden;border:1px solid #d8e8d8;flex-shrink:0}
.photo-preview-item img{width:100%;height:100%;object-fit:cover}
.photo-preview-del{position:absolute;top:2px;right:2px;width:16px;height:16px;background:rgba(0,0,0,0.55);border-radius:50%;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* 植物标记（地图上） */
.plant-marker{position:absolute;cursor:pointer;transform:translate(-50%,-50%);z-index:30;transition:transform .15s;pointer-events:auto}
.plant-marker:hover{transform:translate(-50%,-50%) scale(1.25)}
.marker-body{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.25)}
.marker-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,0.95);border:1px solid #c8d8c8;border-radius:10px;padding:2px 7px;font-size:11px;font-weight:500;color:#2c3e2d;margin-top:3px;pointer-events:none}
.marker-anim{animation:bloom-pulse 2s ease-in-out infinite}
@keyframes bloom-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,180,0,0.5)}50%{box-shadow:0 0 0 8px rgba(255,180,0,0)}}

/* 照片标记 */
.photo-marker{position:absolute;cursor:pointer;transform:translate(-50%,-50%);z-index:25;pointer-events:auto}
.photo-marker-body{width:30px;height:30px;border-radius:50%;background:#3878b8;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}

/* 图例 */
#legend{position:absolute;bottom:64px;left:20px;background:rgba(255,255,255,0.95);border:1px solid #c8d8c8;border-radius:10px;padding:8px 12px;font-size:11px;color:#4a6a4a;z-index:50;max-width:160px}
#legend-title{font-weight:500;margin-bottom:5px;color:#2c3e2d}
.legend-item{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* 添加模式提示条 */
#add-mode-banner{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#3d7a3d;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:40;box-shadow:0 4px 12px rgba(61,122,61,0.3);white-space:nowrap}
#add-mode-banner.show{display:block}

/* ===== 弹窗通用 ===== */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:2000;align-items:center;justify-content:center}
.modal-backdrop.show{display:flex}
.modal-box{background:#fff;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,0.22);width:520px;max-width:96vw;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:modal-in .22s ease-out}
@keyframes modal-in{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{padding:16px 20px 14px;border-bottom:1px solid #e8f0e8;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:15px;font-weight:500;color:#1a3a1a;display:flex;align-items:center;gap:8px}
.modal-close{width:28px;height:28px;border-radius:50%;border:none;background:#f0f4f0;cursor:pointer;font-size:14px;color:#6a8a6a;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#e0ece0;color:#2c3e2d}
.modal-body{overflow-y:auto;padding:16px 20px;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid #e8f0e8;display:flex;gap:10px;justify-content:flex-end;flex-shrink:0}

/* 弹出植物卡片 */
#plant-card{display:none;position:fixed;z-index:1500;background:#fff;border-radius:16px;border:1px solid #d0dcc8;box-shadow:0 8px 32px rgba(0,0,0,0.2);width:330px;max-height:82vh;overflow-y:auto}
#plant-card.show{display:block;animation:card-in .2s ease-out}
@keyframes card-in{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
#card-close{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.8);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#6a8a6a}
#card-close:hover{background:#fff;color:#2c3e2d}
.card-header{padding:16px 40px 12px 16px;background:#e8f5e8;border-radius:16px 16px 0 0;border-bottom:1px solid #d8eed8}
.card-plant-icon{font-size:42px;margin-bottom:6px}
.card-name{font-size:17px;font-weight:600;color:#1a4a1a}
.card-latin{font-size:12px;color:#5a7a5a;font-style:italic;margin-top:2px}
.card-body{padding:12px 16px 16px}
.card-season-strip{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.card-tag{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.tag-green{background:#d4f0d4;color:#2d7a2d}
.tag-amber{background:#fae8c0;color:#7a5000}
.tag-blue{background:#d4e8f8;color:#1850a0}
.tag-purple{background:#ede8f8;color:#5c2d91}
.card-section-title{font-size:12px;font-weight:500;color:#4a7a4a;margin:10px 0 4px;padding-bottom:3px;border-bottom:1px solid #e8f0e8}
.card-desc{font-size:13px;color:#3a5a3a;line-height:1.7}
.card-bloom-chart{margin:6px 0 10px;border-radius:8px;overflow:hidden;border:1px solid #e0ece0}
.bloom-month-row{display:flex;align-items:stretch;font-size:11px}
.bloom-month-label{width:26px;min-width:26px;text-align:center;padding:3px 0;background:#f5fbf5;color:#4a7a4a;border-right:1px solid #e0ece0;display:flex;align-items:center;justify-content:center}
.bloom-bar{height:20px;display:flex;align-items:center;padding:0 6px;font-size:10px;color:#fff;font-weight:500;flex:1}
.bloom-none{background:#f5f5f5;flex:1;color:#b0c8b0;padding:0 6px;height:20px;display:flex;align-items:center;font-size:10px}
.card-photos-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.card-photo{border-radius:8px;overflow:hidden;aspect-ratio:4/3;cursor:pointer}
.card-photo img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.card-photo:hover img{transform:scale(1.04)}

/* 粒子 */
.petal-particle{position:absolute;pointer-events:none;border-radius:50%;opacity:0;animation:petal-fall linear forwards}
@keyframes petal-fall{0%{opacity:.9;transform:translate(0,0) rotate(0deg) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(360deg) scale(.3)}}

/* 季节动画层 */
#season-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15;overflow:hidden}

/* 上传照片面板 */
#upload-zone-main{border:2px dashed #c8d8c8;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:12px}
#upload-zone-main:hover,#upload-zone-main.dragover{border-color:#4a9a4a;background:#f0f9f0}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;border:1px solid #d8e8d8}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb-del{position:absolute;top:4px;right:4px;width:18px;height:18px;background:rgba(0,0,0,0.5);border-radius:50%;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* 新建植物入口按钮 */
.new-plant-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:2px dashed #a8cca8;border-radius:10px;color:#3d7a3d;font-size:13px;font-weight:500;cursor:pointer;margin-top:8px;transition:all .15s;background:#f5fbf5}
.new-plant-btn:hover{border-color:#3d7a3d;background:#e8f5e8}

/* 响应式 */
@media(max-width:700px){
  #side-panel{display:none}
  #toolbar{gap:6px;padding:8px}
  .toolbar-logo{font-size:13px}
  .modal-box{width:98vw}
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#f0f4f0}
::-webkit-scrollbar-thumb{background:#c0d8c0;border-radius:3px}

/* 分割线 */
.form-divider{border:none;border-top:1px solid #e8f0e8;margin:14px 0}

/* 月份区组标题 */
.month-group-title{font-size:11px;color:#6a8a6a;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.month-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <!-- 顶部工具栏 -->
  <div id="toolbar">
    <div class="toolbar-logo"><span>🌿</span>海南师大校园植物地图</div>
    <div class="sep"></div>
    <div class="toolbar-group">
      <span class="toolbar-label">校区</span>
      <select id="campus-select">
        <option value="longjun">龙昆南校区</option>
        <option value="guilinyang">桂林洋校区</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="toolbar-group">
      <span class="toolbar-label">月份</span>
      <select id="month-select">
        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
        <option value="4">4月</option><option value="5">5月</option><option value="6" selected>6月</option>
        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
      </select>
      <span id="season-badge" class="season-badge season-summer">夏季</span>
    </div>
    <div class="sep"></div>
    <button class="btn-primary" id="btn-add-plant">+ 添加植物标记</button>
    <button class="btn-accent" id="btn-toggle-panel">侧边栏</button>
  </div>

  <!-- 主内容 -->
  <div id="main">
    <div id="map-container">
      <div id="map-wrapper">
        <img id="campus-img" src="" alt="校区地图" draggable="false">
        <div id="season-overlay"></div>
        <div id="plant-layer"></div>
        <div id="interaction-layer"></div>
        <div id="add-mode-banner">🌱 请点击地图上的位置，放置植物标记</div>
      </div>
      <div id="zoom-controls">
        <button onclick="zoom(1.2)">+</button>
        <button onclick="zoom(1/1.2)">−</button>
        <button onclick="resetView()" style="font-size:13px">⊙</button>
      </div>
      <div id="scale-info">拖拽移动 · 滚轮缩放 · 右键删除标记</div>
      <div id="legend">
        <div id="legend-title">图例</div>
        <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div>当季开花</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>当季结果</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff5722"></div>开花且结果</div>
        <div class="legend-item"><div class="legend-dot" style="background:#2196f3"></div>用户照片</div>
        <div class="legend-item"><div class="legend-dot" style="background:#9c27b0"></div>非花果期</div>
      </div>
    </div>

    <!-- 右侧面板 -->
    <div id="side-panel">
      <div id="panel-tabs">
        <div class="panel-tab active" onclick="switchTab(0)">植物库</div>
        <div class="panel-tab" onclick="switchTab(1)">已添加</div>
        <div class="panel-tab" onclick="switchTab(2)">照片管理</div>
      </div>
      <div id="panel-content"></div>
    </div>
  </div>
</div>

<!-- ===== 植物信息查看卡片 ===== -->
<div id="plant-card">
  <button id="card-close" onclick="closePlantCard()">✕</button>
  <div class="card-header">
    <div class="card-plant-icon" id="card-icon"></div>
    <div class="card-name" id="card-name"></div>
    <div class="card-latin" id="card-latin"></div>
  </div>
  <div class="card-body">
    <div class="card-season-strip" id="card-tags"></div>
    <div id="card-period-highlight" style="display:none;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px;font-weight:500;display:none;align-items:center;gap:8px">
      <span style="font-size:20px" id="card-period-emoji"></span>
      <span id="card-period-text" style="line-height:1.4"></span>
    </div>
    <div class="card-section-title">形态特征与故事</div>
    <div class="card-desc" id="card-desc"></div>
    <div id="card-remark-section" style="display:none">
      <div class="card-section-title">📝 标记备注</div>
      <div class="card-desc" id="card-remark" style="background:#fdf8e8;padding:10px;border-radius:8px;border:1px solid #f0e0b0;margin-bottom:4px"></div>
    </div>
    <div class="card-section-title">全年开花结果月历</div>
    <div id="card-bloom-chart" class="card-bloom-chart"></div>
    <div id="card-photos-section" style="display:none">
      <div class="card-section-title">实拍照片</div>

// ===== 持久化 =====
function loadFromStorage(){
  try {
    const cp = JSON.parse(localStorage.getItem('plantmap_custom_plants')||'[]');
    cp.forEach(c=>{ if(!PLANT_DB.find(p=>p.id===c.id)) PLANT_DB.push(c); });
    addedPlants = JSON.parse(localStorage.getItem('plantmap_plants')||'[]');
    uploadedPhotos = JSON.parse(localStorage.getItem('plantmap_photos')||'[]');
  } catch(e){}
}
function saveToStorage(){
  try {
    localStorage.setItem('plantmap_custom_plants', JSON.stringify(PLANT_DB.filter(p=>p.custom)));
    localStorage.setItem('plantmap_plants', JSON.stringify(addedPlants));
    localStorage.setItem('plantmap_photos', JSON.stringify(uploadedPhotos));
  } catch(e){
    if(e.name==='QuotaExceededError') showToast('⚠️ 存储空间不足，部分照片数据未保存');
  }
}

// ===== 地图加载 =====
function loadCampusMap(){
  const img = document.getElementById('campus-img');
  img.style.display = 'block';
  img.src = CAMPUS_IMAGES[currentCampus];
  img.onload = function(){
    imgNaturalW = img.naturalWidth; imgNaturalH = img.naturalHeight;
    resetView();
  };
  img.onerror = function(){
    img.style.display = 'none';
    showToast('地图图片加载失败，请确保图片文件与网页在同一文件夹');
  };
}

function resetView(){
  const container = document.getElementById('map-container');
  const cw = container.clientWidth, ch = container.clientHeight;
  if(!imgNaturalW) return;
  const scale = Math.min(cw/imgNaturalW, ch/imgNaturalH) * 0.95;
  scaleFactor = scale;
  panX = (cw - imgNaturalW*scale)/2;
  panY = (ch - imgNaturalH*scale)/2;
  applyTransform(); renderMarkers();
}

function applyTransform(){
  const img = document.getElementById('campus-img');
  img.style.transform = `translate(${panX}px,${panY}px) scale(${scaleFactor})`;
  img.style.transformOrigin = '0 0';
  const pl = document.getElementById('plant-layer');
  pl.style.transform = `translate(${panX}px,${panY}px)`;
  pl.style.width = imgNaturalW*scaleFactor+'px';
  pl.style.height = imgNaturalH*scaleFactor+'px';
  const sl = document.getElementById('season-overlay');
  sl.style.transform = `translate(${panX}px,${panY}px)`;
  sl.style.width = imgNaturalW*scaleFactor+'px';
  sl.style.height = imgNaturalH*scaleFactor+'px';
  renderMarkers();
}

function zoom(factor){
  const container = document.getElementById('map-container');
  const cx = container.clientWidth/2, cy = container.clientHeight/2;
  const old = scaleFactor;
  scaleFactor = Math.max(0.3, Math.min(4, scaleFactor*factor));
  panX = cx-(cx-panX)*(scaleFactor/old);
  panY = cy-(cy-panY)*(scaleFactor/old);
  applyTransform();
}

// ===== 地图交互 =====
function initMapInteraction(){
  const layer = document.getElementById('interaction-layer');
  layer.addEventListener('mousedown', e=>{
    if(addingMode) return;
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
    layer.style.cursor = 'grabbing';
  });
  document.addEventListener('mousemove', e=>{
    if(!isDragging) return;
    panX += e.clientX-lastX; panY += e.clientY-lastY;
    lastX = e.clientX; lastY = e.clientY; applyTransform();
  });
  document.addEventListener('mouseup', ()=>{ isDragging=false; layer.style.cursor=addingMode?'crosshair':'default'; });
  layer.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect = layer.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    const factor = e.deltaY<0?1.12:1/1.12;
    const old = scaleFactor;
    scaleFactor = Math.max(0.3, Math.min(4, scaleFactor*factor));
    panX = mx-(mx-panX)*(scaleFactor/old);
    panY = my-(my-panY)*(scaleFactor/old);
    applyTransform();
  }, {passive:false});

  // 点击放置
  layer.addEventListener('click', e=>{
    if(!addingMode) return;
    const rect = layer.getBoundingClientRect();
    const px = (e.clientX-rect.left-panX)/(imgNaturalW*scaleFactor);
    const py = (e.clientY-rect.top-panY)/(imgNaturalH*scaleFactor);
    if(px<0||py<0||px>1||py>1){ showToast('请点击地图范围内的位置'); return; }
    pendingPlaceX = px; pendingPlaceY = py;
    openPlacePlantModal();
  });

  // 触摸
  let touchDist = 0;
  layer.addEventListener('touchstart', e=>{
    if(e.touches.length===2) touchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    else if(e.touches.length===1 && !addingMode){ isDragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
  },{passive:true});
  layer.addEventListener('touchmove', e=>{
    if(e.touches.length===2){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(touchDist>0){ zoom(d>touchDist?1.05:0.95); touchDist=d; }
    } else if(e.touches.length===1&&isDragging){
      panX+=e.touches[0].clientX-lastX; panY+=e.touches[0].clientY-lastY;
      lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; applyTransform();
    }
  },{passive:true});
  layer.addEventListener('touchend', ()=>{isDragging=false;touchDist=0;},{passive:true});
}

// ===== 渲染标记 =====
function renderMarkers(){
  const layer = document.getElementById('plant-layer');
  layer.innerHTML = '';
  const W = imgNaturalW*scaleFactor, H = imgNaturalH*scaleFactor;

  addedPlants.filter(p=>p.campus===currentCampus).forEach(ap=>{
    const plant = PLANT_DB.find(p=>p.id===ap.plantId);
    if(!plant) return;
    const isBloom = plant.bloom.includes(currentMonth);
    const isFruit = plant.fruit.includes(currentMonth);
    let col = '#9c27b0';
    let anim = '';
    if(isBloom && isFruit){ col='#ff5722'; anim='marker-anim'; }
    else if(isBloom){ col='#4caf50'; anim='marker-anim'; }
    else if(isFruit){ col='#ff9800'; }

    const el = document.createElement('div');
    el.className = 'plant-marker';
    el.style.left = (ap.x*W)+'px';
    el.style.top = (ap.y*H)+'px';
    el.innerHTML = `
      <div class="marker-body ${anim}" style="background:${col}">${plant.icon}</div>
      <div class="marker-label">${plant.name}</div>
      ${isBloom&&!isFruit?'<div style="position:absolute;top:-8px;right:-6px;font-size:9px;background:#e8f5e8;border:1px solid #a8d8a8;border-radius:20px;padding:1px 5px;color:#2d7a2d;white-space:nowrap">🌸开花</div>':''}
      ${isFruit&&!isBloom?'<div style="position:absolute;top:-8px;right:-6px;font-size:9px;background:#fff8e0;border:1px solid #e0c060;border-radius:20px;padding:1px 5px;color:#a06000;white-space:nowrap">🍊结果</div>':''}
      ${isBloom&&isFruit?'<div style="position:absolute;top:-8px;right:-6px;font-size:9px;background:#fff0e8;border:1px solid #f0a060;border-radius:20px;padding:1px 5px;color:#c04000;white-space:nowrap">🌸🍊</div>':''}
    `;
    el.addEventListener('click', e=>{ e.stopPropagation(); if(addingMode) return; showPlantCard(ap.id,e.clientX,e.clientY); });
    el.addEventListener('contextmenu', e=>{
      e.preventDefault();
      if(confirm(`删除"${plant.name}"的标记？`)){
        addedPlants = addedPlants.filter(p=>p.id!==ap.id);
        saveToStorage(); renderMarkers(); if(currentTab===1) renderPanel();
      }
    });
    layer.appendChild(el);
  });

  uploadedPhotos.filter(p=>p.campus===currentCampus).forEach(photo=>{
    const el = document.createElement('div');
    el.className = 'photo-marker';
    el.style.left = (photo.x*W)+'px';
    el.style.top = (photo.y*H)+'px';
    el.innerHTML = `<div class="photo-marker-body">📷</div>`;
    el.title = photo.name;
    el.addEventListener('click', e=>{ e.stopPropagation(); showPhotoFullscreen(photo.url, photo.name); });
    layer.appendChild(el);
  });
}

// ===== 植物卡片 =====
function showPlantCard(markerId, cx, cy){
  const ap = addedPlants.find(p=>p.id===markerId);
  if(!ap) return;
  const plant = PLANT_DB.find(p=>p.id===ap.plantId);
  if(!plant) return;

  document.getElementById('card-icon').textContent = plant.icon;
  document.getElementById('card-name').textContent = plant.name;
  document.getElementById('card-latin').textContent = plant.latin || '';

  const isBloom = plant.bloom.includes(currentMonth);
  const isFruit = plant.fruit.includes(currentMonth);

  // ---- 当前所处时期高亮 ----
  const periodEl = document.getElementById('card-period-highlight');
  const periodEmoji = document.getElementById('card-period-emoji');
  const periodText = document.getElementById('card-period-text');
  if(isBloom && isFruit){
    periodEl.style.display = 'flex'; periodEl.style.background = '#fff0e8'; periodEl.style.border = '1px solid #f0a060';
    periodEmoji.textContent = '🌸🍊'; periodText.innerHTML = '<b>当前所处时期：开花 + 结果期</b><br><span style="font-size:11px;font-weight:400;color:#a05020">正值花果同期的美好时节</span>';
  } else if(isBloom){
    periodEl.style.display = 'flex'; periodEl.style.background = '#e8f5e8'; periodEl.style.border = '1px solid #a8d8a8';
    periodEmoji.textContent = '🌸'; periodText.innerHTML = '<b>当前所处时期：开花期</b><br><span style="font-size:11px;font-weight:400;color:#4a7a4a">正是观赏花朵的最佳时间</span>';
  } else if(isFruit){
    periodEl.style.display = 'flex'; periodEl.style.background = '#fff8e0'; periodEl.style.border = '1px solid #e0c060';
    periodEmoji.textContent = '🍊'; periodText.innerHTML = '<b>当前所处时期：结果期</b><br><span style="font-size:11px;font-weight:400;color:#a08030">果实正在成熟中</span>';
  } else if(plant.dormant.includes(currentMonth)){
    periodEl.style.display = 'flex'; periodEl.style.background = '#f0e8f8'; periodEl.style.border = '1px solid #c8b0e0';
    periodEmoji.textContent = '💤'; periodText.innerHTML = '<b>当前所处时期：休眠期</b><br><span style="font-size:11px;font-weight:400;color:#6a4a8a">植物正在休养生息</span>';
  } else {
    periodEl.style.display = 'flex'; periodEl.style.background = '#f0f8f0'; periodEl.style.border = '1px solid #b8d8b8';
    periodEmoji.textContent = '🌿'; periodText.innerHTML = '<b>当前所处时期：营养生长期</b><br><span style="font-size:11px;font-weight:400;color:#4a7a4a">正在进行营养积累</span>';
  }
  const note = (plant.season_notes||{})[currentMonth];
  if(note) periodText.innerHTML += `<br><span style="font-size:11px;font-weight:400;color:#2d6a2d;background:#e8f5e8;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:3px">📅 ${note}</span>`;

  // ---- 标签 ----
  const tagsEl = document.getElementById('card-tags');
  const tags = plant.tags || [];
  tagsEl.innerHTML = tags.map(t=>`<span class="card-tag tag-green">${t}</span>`).join('');
  if(isBloom) tagsEl.innerHTML += '<span class="card-tag tag-amber">🌸 当季开花</span>';
  if(isFruit) tagsEl.innerHTML += '<span class="card-tag tag-amber">🍊 当季结果</span>';
  if(!isBloom && !isFruit) tagsEl.innerHTML += '<span class="card-tag tag-purple">💤 休眠/营养期</span>';

  document.getElementById('card-desc').textContent = plant.desc || '（暂无介绍）';

  // ---- 标记备注 ----
  if(ap.remark && ap.remark.trim()){
    document.getElementById('card-remark-section').style.display = 'block';
    document.getElementById('card-remark').textContent = ap.remark;
  } else {
    document.getElementById('card-remark-section').style.display = 'none';
  }
  buildBloomChart(plant);

  // 合并植物库照片 + 标记照片
  const allPhotos = [...(plant.photos||[]), ...(ap.photos||[])];
  if(allPhotos.length>0){
    document.getElementById('card-photos-section').style.display = 'block';
    document.getElementById('card-photos').innerHTML = allPhotos.map(p=>`
      <div class="card-photo" onclick="showPhotoFullscreen('${p}','${plant.name}')"><img src="${p}" alt="${plant.name}"></div>
    `).join('');
  } else {
    document.getElementById('card-photos-section').style.display = 'none';
  }

  const card = document.getElementById('plant-card');
  card.classList.add('show');
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = cx+20, top = cy-60;
  if(left+350>vw) left = cx-350;
  if(top+480>vh) top = vh-490;
  if(top<10) top = 10;
  card.style.left = left+'px'; card.style.top = top+'px'; card.style.position = 'fixed';

  if(isBloom) spawnPetals(cx, cy, plant.color);
}

function closePlantCard(){
  document.getElementById('plant-card').classList.remove('show');
}

function buildBloomChart(plant){
  const chart = document.getElementById('card-bloom-chart');
  chart.innerHTML = Array.from({length:12},(_,i)=>{
    const m = i+1;
    const b = plant.bloom.includes(m), f = plant.fruit.includes(m), d = plant.dormant.includes(m);
    const cur = m===currentMonth;
    let bar;
    if(b&&f) bar = `<div class="bloom-bar" style="background:#ff5722;flex:1">开花结果</div>`;
    else if(b) bar = `<div class="bloom-bar" style="background:#4caf50;flex:1">开花期</div>`;
    else if(f) bar = `<div class="bloom-bar" style="background:#ff9800;flex:1">结果期</div>`;
    else if(d) bar = `<div class="bloom-none">休眠期</div>`;
    else bar = `<div class="bloom-none">营养生长</div>`;
    return `<div class="bloom-month-row">
      <div class="bloom-month-label" style="${cur?'background:#3d7a3d;color:#fff;font-weight:500':''}">${m}</div>
      ${bar}
    </div>`;
  }).join('');
}

// ===== 花瓣动画 =====
function spawnPetals(x,y,color){
  const overlay = document.getElementById('season-overlay');
  for(let i=0;i<14;i++){
    const p = document.createElement('div');
    p.className = 'petal-particle';
    const angle = Math.random()*Math.PI*2;
    const dist = 50+Math.random()*90;
    p.style.cssText = `width:${5+Math.random()*6}px;height:${5+Math.random()*6}px;background:${color};left:${x-panX}px;top:${y-panY}px;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;animation-duration:${0.7+Math.random()*0.6}s;animation-delay:${Math.random()*0.25}s;`;
    overlay.appendChild(p);
    setTimeout(()=>p.remove(),1400);
  }
}

function startSeasonAnimation(){
  animFrames.forEach(f=>clearInterval(f));
  animFrames = [];
  document.getElementById('season-overlay').innerHTML = '';
  const season = getSeason(currentMonth);
  if(season.name==='春季'||season.name==='夏季'){
    animFrames.push(setInterval(()=>{
      const bloomPlants = addedPlants.filter(ap=>{
        if(ap.campus!==currentCampus) return false;
        const pl = PLANT_DB.find(p=>p.id===ap.plantId);
        return pl&&pl.bloom.includes(currentMonth);
      });
      if(!bloomPlants.length) return;
      const ap = bloomPlants[Math.floor(Math.random()*bloomPlants.length)];
      const pl = PLANT_DB.find(p=>p.id===ap.plantId);
      const W=imgNaturalW*scaleFactor, H=imgNaturalH*scaleFactor;
      spawnPetals(ap.x*W+panX, ap.y*H+panY, pl.color);
    }, 3000));
  }
}

      <div class="plant-info">

        ${plant.custom?`<div class="plant-del" onclick="deletePlantType('${plant.id}');event.stopPropagation()" title="删除">✕</div>`:''}

function selectPlantType(id){
  selectedPlantType = id;
  enterAddMode();
  renderPanel();
  const plant = PLANT_DB.find(p=>p.id===id);
  showToast(`已选择 ${plant.name}，请在地图上点击放置位置`);
}

function deletePlantType(id){
  const plant = PLANT_DB.find(p=>p.id===id);
  if(!plant) return;
  if(!confirm(`确定删除植物类型"${plant.name}"？已放置的该植物标记也将被移除。`)) return;
  PLANT_DB = PLANT_DB.filter(p=>p.id!==id);
  addedPlants = addedPlants.filter(p=>p.plantId!==id);
  saveToStorage(); renderMarkers(); renderPanel();
}

// ----- Tab1: 已添加 -----

    container.innerHTML = `<div style="text-align:center;padding:40px 16px;color:#8aaa8a">

    </div>`;

  }

  list.forEach(ap=>{
    const plant = PLANT_DB.find(p=>p.id===ap.plantId);
    if(!plant) return;
    const isBloom = plant.bloom.includes(currentMonth);
    const isFruit = plant.fruit.includes(currentMonth);
    const item = document.createElement('div');
    item.className = 'plant-item';

      <div class="plant-icon-circle" style="background:${isBloom?'#e8f5e8':isFruit?'#fff5e0':'#f0f0f8'};border:1.5px solid ${isBloom?'#a8d8a8':isFruit?'#e0c080':'#c8c8e8'}">${plant.icon}</div>
      <div class="plant-info">
        <div class="plant-name-text" style="cursor:pointer" onclick="focusMarker(addedPlants.find(p=>p.id==${ap.id}))">${plant.name}</div>
        <div class="plant-sub-text">${(ap.photos&&ap.photos.length)?`📷 ${ap.photos.length} 张照片`:'无照片'}</div>
        <div style="font-size:11px;color:${isBloom?'#2d8a2d':isFruit?'#b06000':'#8a8a8a'}">${isBloom?'🌸 当季开花':isFruit?'🍊 当季结果':'休眠/营养期'}</div>
      </div>
      <div class="plant-actions">
        <label style="width:22px;height:22px;border-radius:50%;border:1px solid #c8e0c8;background:#fff;color:#3d7a3d;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center" title="附加照片">
          📷<input type="file" accept="image/*" multiple style="display:none" onchange="attachPhotoToMarker(event,${ap.id})">
        </label>
        <div class="plant-del" onclick="deleteMarker(${ap.id})" title="删除标记">✕</div>
      </div>
    `;

}

function deleteMarker(id){
  addedPlants = addedPlants.filter(p=>p.id!==id);
  saveToStorage(); renderMarkers(); renderPanel();
}
function attachPhotoToMarker(event, markerId){
  const ap = addedPlants.find(p=>p.id===markerId);
  if(!ap) return;
  Array.from(event.target.files).forEach(f=>{
    const reader = new FileReader();
    reader.onload = e=>{ ap.photos = ap.photos||[]; ap.photos.push(e.target.result); saveToStorage(); showToast('照片已附加！'); };
    reader.readAsDataURL(f);
  });
}
function focusMarker(ap){
  if(!ap) return;
  const c = document.getElementById('map-container');
  panX = c.clientWidth/2 - ap.x*imgNaturalW*scaleFactor;
  panY = c.clientHeight/2 - ap.y*imgNaturalH*scaleFactor;
  applyTransform();
}

// ----- Tab2: 照片管理 -----
function renderPhotoPanel(container){
  container.innerHTML = `
    <div id="upload-zone-main" onclick="document.getElementById('file-input-campus-photo').click()">
      <div style="font-size:32px">📷</div>
      <p style="font-size:13px;margin-top:4px">点击或拖拽上传校园植物照片</p>
      <p style="font-size:11px;color:#9aaa9a">照片会自动标注在地图上</p>
    </div>
    <div style="font-size:12px;color:#6a8a6a;margin-bottom:8px">${currentCampus==='longjun'?'龙昆南':'桂林洋'}校区 · ${uploadedPhotos.filter(p=>p.campus===currentCampus).length} 张照片</div>
    <div id="photo-gallery-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>
  `;
  const zone = document.getElementById('upload-zone-main');
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');processPhotoFiles(e.dataTransfer.files);});
  renderPhotoGallery();
}
function renderPhotoGallery(){
  const g = document.getElementById('photo-gallery-grid');
  if(!g) return;
  const list = uploadedPhotos.filter(p=>p.campus===currentCampus);
  if(!list.length){ g.innerHTML='<div style="text-align:center;padding:20px;color:#8aaa8a;font-size:12px;grid-column:1/-1">暂无照片</div>'; return; }
  g.innerHTML = list.map(p=>`
    <div class="photo-thumb">
      <img src="${p.url}" onclick="showPhotoFullscreen('${p.url}','${p.name}')" style="cursor:pointer">
      <div class="photo-thumb-del" onclick="deleteUploadedPhoto(${p.id})">✕</div>
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.45);color:#fff;font-size:10px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
    </div>
  `).join('');
}
function handlePhotoUpload(e){ processPhotoFiles(e.target.files); }
function processPhotoFiles(files){
  Array.from(files).forEach(f=>{
    if(!f.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e=>{
      uploadedPhotos.push({id:Date.now()+Math.random(),url:e.target.result,name:f.name.replace(/\.[^.]+$/,''),campus:currentCampus,x:0.2+Math.random()*0.6,y:0.2+Math.random()*0.6});
      saveToStorage(); renderMarkers(); renderPhotoGallery();
      showToast('照片已上传并标注在地图上');
    };
    reader.readAsDataURL(f);
  });
}
function deleteUploadedPhoto(id){ uploadedPhotos=uploadedPhotos.filter(p=>p.id!==id); saveToStorage(); renderMarkers(); renderPhotoGallery(); }

// ===== 新建/编辑植物弹窗 =====
function buildNewPlantForm(plant){
  npPhotos = plant ? [...(plant.photos||[])] : [];
  npBloom = new Set(plant?plant.bloom:[]);
  npFruit = new Set(plant?plant.fruit:[]);
  npDormant = new Set(plant?plant.dormant:[]);
  npIcon = plant?plant.icon:'🌱';
  npColor = plant?plant.color:'#4caf50';

  const monthLabels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  function monthButtons(type, set){
    return monthLabels.map((label,i)=>{
      const m = i+1;
      const sel = set.has(m);
      const cls = sel ? (type==='bloom'?'selected-bloom':type==='fruit'?'selected-fruit':'selected-dormant') : '';
      return `<div class="month-btn ${cls}" onclick="toggleMonth('${type}',${m})" id="mbtn-${type}-${m}">${label}</div>`;
    }).join('');
  }

  const body = document.getElementById('np-modal-body');
  body.innerHTML = `
    <div class="form-row">
      <label class="form-label">植物名称 <span style="color:#e04040">*</span></label>
      <input class="form-input" id="np-name" placeholder="如：凤凰木、黄花风铃木…" value="${plant?plant.name:''}">
    </div>
    <div class="form-row">
      <label class="form-label">拉丁学名（可选）</label>
      <input class="form-input" id="np-latin" placeholder="如：Delonix regia" value="${plant?plant.latin||'':''}">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-row">
        <label class="form-label">植物图标</label>
        <div class="icon-grid" id="np-icon-grid">
          ${PLANT_ICONS.map(ic=>`<div class="icon-btn ${npIcon===ic?'selected':''}" onclick="selectNpIcon('${ic}')">${ic}</div>`).join('')}
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">标记颜色</label>
        <div class="color-grid" id="np-color-grid">
          ${PLANT_COLORS.map(c=>`<div class="color-btn ${npColor===c?'selected':''}" style="background:${c}" onclick="selectNpColor('${c}')"></div>`).join('')}
        </div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:#6a8a6a">预览：</span>
          <div id="np-preview" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.2);background:${npColor}">${npIcon}</div>
        </div>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">关键词标签（逗号分隔，可选）</label>
      <input class="form-input" id="np-tags" placeholder="如：落叶乔木,观花植物" value="${plant?(plant.tags||[]).join(','):''}">
    </div>

    <hr class="form-divider">
    <div style="font-size:13px;font-weight:500;color:#2c3e2d;margin-bottom:10px">物候月历设置</div>
    <div class="form-row">
      <div class="month-group-title"><span class="month-dot" style="background:#4caf50"></span>开花期月份（可多选）</div>
      <div class="month-grid" id="mg-bloom">${monthButtons('bloom',npBloom)}</div>
    </div>
    <div class="form-row">
      <div class="month-group-title"><span class="month-dot" style="background:#ff9800"></span>结果期月份（可多选）</div>
      <div class="month-grid" id="mg-fruit">${monthButtons('fruit',npFruit)}</div>
    </div>
    <div class="form-row">
      <div class="month-group-title"><span class="month-dot" style="background:#9c27b0"></span>休眠期月份（可多选）</div>
      <div class="month-grid" id="mg-dormant">${monthButtons('dormant',npDormant)}</div>
    </div>

    <hr class="form-divider">
    <div class="form-row">
      <label class="form-label">形态特征与故事</label>
      <textarea class="form-input" id="np-desc" placeholder="描述这种植物的外形特征、生长习性、校园故事或文化意义…" rows="4">${plant?plant.desc||'':''}</textarea>
    </div>

    <div class="form-row">
      <label class="form-label">上传实拍照片（可多张）</label>
      <div class="upload-zone" id="np-upload-zone" onclick="document.getElementById('np-file-input').click()">
        <div style="font-size:24px">📷</div>
        <p>点击上传或拖拽图片到此处</p>
      </div>

      r.readAsDataURL(f);
    });
  });
  const nz = document.getElementById('np-upload-zone');
  nz.addEventListener('dragover',e=>{e.preventDefault();nz.classList.add('dragover');});

    e.preventDefault(); nz.classList.remove('dragover');
    Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/')).forEach(f=>{
      const r = new FileReader();

function renderNpPhotoPreview(){
  const c = document.getElementById('np-photo-preview');
  if(!c) return;
  c.innerHTML = npPhotos.map((src,i)=>`
    <div class="photo-preview-item">
      <img src="${src}">
      <div class="photo-preview-del" onclick="removeNpPhoto(${i})">✕</div>
    </div>
  `).join('');
}
function removeNpPhoto(i){ npPhotos.splice(i,1); renderNpPhotoPreview(); }

function toggleMonth(type, m){
  const sets = {bloom:npBloom,fruit:npFruit,dormant:npDormant};
  const s = sets[type];
  if(s.has(m)) s.delete(m); else s.add(m);
  const btn = document.getElementById(`mbtn-${type}-${m}`);
  if(btn){
    const clsMap = {bloom:'selected-bloom',fruit:'selected-fruit',dormant:'selected-dormant'};
    btn.className = 'month-btn ' + (s.has(m)?clsMap[type]:'');
  }
}

function selectNpIcon(ic){
  npIcon = ic;
  document.querySelectorAll('#np-icon-grid .icon-btn').forEach(b=>b.classList.toggle('selected', b.textContent===ic));
  updateNpPreview();
}
function selectNpColor(c){
  npColor = c;
  document.querySelectorAll('#np-color-grid .color-btn').forEach(b=>b.classList.toggle('selected', b.style.background===c||b.style.backgroundColor===c));
  updateNpPreview();
}
function updateNpPreview(){
  const p = document.getElementById('np-preview');
  if(p){ p.style.background = npColor; p.textContent = npIcon; }
}

function openNewPlantModal(){
  npEditId = null;
  document.getElementById('np-modal-title').textContent = '新建植物类型';
  document.getElementById('np-modal-icon').textContent = '🌱';

  npEditId = null;
}

function saveNewPlant(){
  const name = document.getElementById('np-name').value.trim();
  if(!name){ showToast('请填写植物名称！'); return; }
  const latin = document.getElementById('np-latin').value.trim();
  const desc = document.getElementById('np-desc').value.trim();
  const tagsRaw = document.getElementById('np-tags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(/[,，]/).map(s=>s.trim()).filter(Boolean) : [];

  if(npEditId){
    const plant = PLANT_DB.find(p=>p.id===npEditId);
    if(plant){
      plant.name = name; plant.latin = latin; plant.icon = npIcon; plant.color = npColor;
      plant.bloom = [...npBloom].sort((a,b)=>a-b);
      plant.fruit = [...npFruit].sort((a,b)=>a-b);
      plant.dormant = [...npDormant].sort((a,b)=>a-b);
      plant.desc = desc; plant.tags = tags; plant.photos = [...npPhotos];
    }
    showToast(`植物"${name}"已更新！`);
  } else {
    const id = 'custom_'+Date.now();
    PLANT_DB.push({
      id, name, latin, icon:npIcon, color:npColor,
      bloom:[...npBloom].sort((a,b)=>a-b),
      fruit:[...npFruit].sort((a,b)=>a-b),
      dormant:[...npDormant].sort((a,b)=>a-b),
      desc, tags, custom:true, photos:[...npPhotos],
      season_notes:{}
    });
    showToast(`植物"${name}"已添加到植物库！`);
  }
  saveToStorage();
  closeNewPlantModal();
  renderMarkers(); renderPanel();
}

// ===== 放置植物弹窗 =====
function openPlacePlantModal(){
  ppPhotos = [];
  ppMarkerId = null;
  ppPlantId = selectedPlantType;

  const body = document.getElementById('pp-modal-body');
  const monthLabels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  // 如果已有选中植物类型，预填；否则让用户选
  if(ppPlantId){
    const plant = PLANT_DB.find(p=>p.id===ppPlantId);
    document.getElementById('pp-modal-title').textContent = `添加植物标记 · ${plant.name}`;
    body.innerHTML = buildPlacePlantBody(plant, true);
  } else {
    document.getElementById('pp-modal-title').textContent = '添加植物标记';
    body.innerHTML = buildPlacePlantBody(null, false);
  }

  bindPpEvents();
  document.getElementById('place-plant-modal').classList.add('show');
}

function buildPlacePlantBody(plant, hasPre){
  const monthLabels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const isPreset = hasPre && plant && !plant.custom;

  return `
    <div class="form-row">
      <label class="form-label">选择植物类型 <span style="color:#e04040">*</span></label>
      <select class="form-input" id="pp-plant-select" onchange="onPpPlantChange(this.value)">
        <option value="">— 请选择 —</option>
        ${PLANT_DB.map(p=>`<option value="${p.id}" ${p.id===ppPlantId?'selected':''}>${p.icon} ${p.name}${p.custom?' (自定义)':''}</option>`).join('')}
        <option value="__new__">🌱 + 新建植物类型…</option>
      </select>
      <div style="margin-top:6px;font-size:11px;color:#6a8a6a">没找到？选择"新建植物类型"快速添加</div>
    </div>

    <div id="pp-plant-preview" style="${plant?'':'display:none'}">
      ${plant?`<div style="display:flex;align-items:center;gap:10px;padding:10px;background:#f5fbf5;border-radius:10px;border:1px solid #d0ecd0;margin-bottom:12px">
        <div style="width:42px;height:42px;border-radius:50%;background:${plant.color};display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">${plant.icon}</div>
        <div>
          <div style="font-size:14px;font-weight:500;color:#1a3a1a">${plant.name}</div>
          <div style="font-size:11px;color:#5a7a5a;font-style:italic">${plant.latin||''}</div>
          <div style="font-size:11px;color:#4a8a4a;margin-top:2px">${plant.bloom.includes(currentMonth)?'🌸 当季开花 ':''}${plant.fruit.includes(currentMonth)?'🍊 当季结果':''}</div>
        </div>
      </div>`:''}
    </div>

    <hr class="form-divider" style="margin:10px 0">
    <div style="font-size:12px;font-weight:500;color:#3a5a3a;margin-bottom:10px">为这个标记补充信息（可选）</div>

    <div class="form-row">
      <label class="form-label">上传实拍照片（可多张）</label>
      <div class="upload-zone" id="pp-upload-zone" onclick="document.getElementById('pp-file-input').click()" style="padding:12px">
        <div style="font-size:22px">📷</div>
        <p style="font-size:12px;margin-top:3px">点击上传照片</p>
      </div>
      <div id="pp-photo-preview" class="photo-preview-grid" style="margin-top:6px"></div>
      <input type="file" id="pp-file-input" accept="image/*" multiple style="display:none">
    </div>

    <div class="form-row">
      <label class="form-label">备注说明（该位置的补充信息）</label>
      <textarea class="form-input" id="pp-remark" placeholder="如：这棵芒果树树龄约20年，每年6月果实累累…" rows="3" style="min-height:60px"></textarea>
    </div>
  `;
}

function bindPpEvents(){
  const fi = document.getElementById('pp-file-input');
  if(fi){
    fi.addEventListener('change', e=>{
      Array.from(e.target.files).forEach(f=>{
        const r = new FileReader();
        r.onload = ev=>{ ppPhotos.push(ev.target.result); renderPpPhotoPreview(); };
        r.readAsDataURL(f);
      });
    });
  }
  const pz = document.getElementById('pp-upload-zone');
  if(pz){
    pz.addEventListener('dragover',e=>{e.preventDefault();pz.classList.add('dragover');});
    pz.addEventListener('dragleave',()=>pz.classList.remove('dragover'));
    pz.addEventListener('drop',e=>{
      e.preventDefault(); pz.classList.remove('dragover');
      Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/')).forEach(f=>{
        const r = new FileReader();
        r.onload = ev=>{ ppPhotos.push(ev.target.result); renderPpPhotoPreview(); };
        r.readAsDataURL(f);
      });
    });
  }
}

function renderPpPhotoPreview(){
  const c = document.getElementById('pp-photo-preview');
  if(!c) return;
  c.innerHTML = ppPhotos.map((src,i)=>`
    <div class="photo-preview-item">
      <img src="${src}">
      <div class="photo-preview-del" onclick="removePpPhoto(${i})">✕</div>
    </div>
  `).join('');
}
function removePpPhoto(i){ ppPhotos.splice(i,1); renderPpPhotoPreview(); }

function onPpPlantChange(val){
  if(val==='__new__'){
    document.getElementById('pp-plant-select').value = ppPlantId||'';
    closePlacePlantModal_noCancel();
    openNewPlantModal();
    return;
  }
  ppPlantId = val;
  const plant = PLANT_DB.find(p=>p.id===val);
  const preview = document.getElementById('pp-plant-preview');
  if(preview && plant){
    preview.style.display = 'block';
    preview.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:10px;background:#f5fbf5;border-radius:10px;border:1px solid #d0ecd0;margin-bottom:12px">
      <div style="width:42px;height:42px;border-radius:50%;background:${plant.color};display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">${plant.icon}</div>
      <div>
        <div style="font-size:14px;font-weight:500;color:#1a3a1a">${plant.name}</div>
        <div style="font-size:11px;color:#5a7a5a;font-style:italic">${plant.latin||''}</div>
        <div style="font-size:11px;color:#4a8a4a;margin-top:2px">${plant.bloom.includes(currentMonth)?'🌸 当季开花 ':''}${plant.fruit.includes(currentMonth)?'🍊 当季结果':''}</div>
      </div>
    </div>`;
    document.getElementById('pp-modal-title').textContent = `添加植物标记 · ${plant.name}`;
  }
}

function closePlacePlantModal_noCancel(){
  document.getElementById('place-plant-modal').classList.remove('show');
}
function cancelPlacePlant(){
  document.getElementById('place-plant-modal').classList.remove('show');
  pendingPlaceX = null; pendingPlaceY = null;
  exitAddMode();
}
function confirmPlacePlant(){
  const selectEl = document.getElementById('pp-plant-select');
  ppPlantId = ppPlantId || (selectEl?selectEl.value:'');
  if(!ppPlantId || ppPlantId==='__new__'){ showToast('请先选择植物类型！'); return; }
  if(pendingPlaceX===null){ showToast('请先在地图上点击位置！'); return; }

  const remark = document.getElementById('pp-remark')?.value.trim()||'';

  const markerId = Date.now();
  addedPlants.push({
    id: markerId,
    plantId: ppPlantId,
    x: pendingPlaceX, y: pendingPlaceY,
    campus: currentCampus,
    photos: [...ppPhotos],
    remark
  });

  document.getElementById('place-plant-modal').classList.remove('show');
  pendingPlaceX = null; pendingPlaceY = null; ppPlantId = null; ppPhotos = [];
  exitAddMode();
  saveToStorage();
  renderMarkers();
  if(currentTab===1) renderPanel();

  const plant = PLANT_DB.find(p=>p.id===addedPlants[addedPlants.length-1].plantId);
  showToast(`${plant?plant.name:'植物'}标记已成功放置！`);
  spawnPetals(window.innerWidth/2, window.innerHeight/2, plant?plant.color:'#4caf50');
}

// ===== 季节 / 工具 =====
function updateSeasonBadge(){
  const s = getSeason(currentMonth);
  const b = document.getElementById('season-badge');
  b.textContent = s.name; b.className = 'season-badge '+s.cls;
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(20,50,20,0.92);color:#fff;padding:9px 22px;border-radius:20px;font-size:13px;z-index:9999;transition:opacity .3s;pointer-events:none;white-space:nowrap';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.style.opacity='0', 2800);
}

function showPhotoFullscreen(url, name){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9000;display:flex;align-items:center;justify-content:center;cursor:pointer';
  ov.innerHTML = `<div style="position:relative;max-width:92vw;max-height:92vh"><img src="${url}" style="max-width:92vw;max-height:88vh;object-fit:contain;border-radius:12px"><div style="position:absolute;bottom:-34px;left:0;right:0;text-align:center;color:#fff;font-size:13px">${name}</div></div>`;
  ov.onclick = ()=>ov.remove();
  document.body.appendChild(ov);
}

window.addEventListener('resize', ()=>{ if(imgNaturalW) resetView(); });

const _s = document.createElement('style');
_s.textContent = '#interaction-layer{cursor:default}#interaction-layer.adding{cursor:crosshair}';
document.head.appendChild(_s);
setInterval(()=>{
  const l = document.getElementById('interaction-layer');
  if(l) l.className = addingMode?'adding':'';
}, 80);

// ESC 关闭弹窗/卡片
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(document.getElementById('new-plant-modal').classList.contains('show')){ closeNewPlantModal(); return; }
    if(document.getElementById('place-plant-modal').classList.contains('show')){ cancelPlacePlant(); return; }
    if(document.getElementById('plant-card').classList.contains('show')){ closePlantCard(); return; }
    if(addingMode) exitAddMode();
  }
});
</script>
